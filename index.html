<!doctype html>
<!-- Moist.biz, Danny Hand -->
<html dir="ltr" lang="en-us">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="content-type" content="text/html; charset=utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Danny Hand : moist.biz</title>
  <style type="text/css">
    @charset "utf-8";
    @namespace svg url("http://www.w3.org/2000/svg");

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      touch-action: none;
      /* lets finger drags draw a wake instead of scrolling */
    }

    body {
      background: linear-gradient(-45deg, #1e3a5f, #2196c9, #00d4d4, #7fe8e0);
      background-size: 400% 400%;
      animation: gradientShift 10s ease infinite;
      color: #5b646d;
      font-family: "Roboto", sans-serif;
      font-size: 16px;
      line-height: 1em;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image: url("wtrsvg.svg");
      background-repeat: repeat;
      background-size: 200px 200px;
      background-position: center center;
      opacity: 0.1;
      pointer-events: none;
      z-index: 0;
      animation: scrollRight 8s linear infinite;
    }

    /* Rain layer: sits above the wave pattern, below page content */
    #rain {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    /* Faint corner link */
    .corner-link {
      position: fixed;
      right: 12px;
      bottom: 10px;
      z-index: 2;
      font-size: 11px;
      letter-spacing: 0.03em;
      color: rgba(255, 255, 255, 0.35);
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .corner-link:hover,
    .corner-link:focus-visible {
      color: rgba(255, 255, 255, 0.85);
    }

    @keyframes gradientShift {
      0% {
        background-position: 0% 50%;
      }

      50% {
        background-position: 100% 50%;
      }

      100% {
        background-position: 0% 50%;
      }
    }

    @keyframes scrollRight {
      from {
        background-position: 0 center;
      }

      to {
        background-position: 200px center;
      }
    }
  </style>
</head>

<body>
  <canvas id="rain" aria-hidden="true"></canvas>
  <div style="height: 800px"></div>
  <a class="corner-link" href="https://dannyhand.us">dannyhand.us</a>

  <script>
      (function () {
        // ---- Tweakables ----
        const DROPS_PER_SEC_PER_MP = 60; // spawn rate per megapixel of screen
        const ANGLE = 0.35;              // slant in radians from vertical (+ = drifts right, matches wave scroll)
        const FALL_SPEED = [700, 1000];  // px/sec, vertical component
        const FALL_DIST = [120, 380];    // how far a drop falls before landing
        const STREAK_LEN = [14, 28];     // streak length in px
        const RIPPLE_SIZE = [10, 26];    // max ripple radius
        const RIPPLE_LIFE = 0.8;         // seconds
        const COLOR = "220, 245, 255";   // rgb for drops and ripples

        // Tap-to-splash
        const SPLASH_RIPPLE = 70;        // max radius of the big tap ripple
        const SPLASH_LIFE = 1.4;         // seconds the big ripple lasts
        const SPLASH_DROPLETS = [6, 10]; // droplets flung out per tap
        const DROPLET_SPEED = [60, 160]; // outward speed, px/sec
        const DROPLET_LIFT = [180, 320]; // initial upward speed, px/sec
        const GRAVITY = 900;             // px/sec² pulling droplets back down

        // Drag wake
        const DRAG_SPACING = 12;         // px between wake ripples (smaller = smoother, more ripples)
        const DRAG_RIPPLE = [22, 34];    // max radius of each wake ripple
        const DRAG_LIFE = 1.1;           // seconds each wake ripple lasts

        if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;

        const canvas = document.getElementById("rain");
        const ctx = canvas.getContext("2d");
        const TAN = Math.tan(ANGLE), SIN = Math.sin(ANGLE), COS = Math.cos(ANGLE);
        const rand = (r) => r[0] + Math.random() * (r[1] - r[0]);

        let w = 0, h = 0;
        let drops = [], ripples = [], particles = [], spawnAcc = 0, last = performance.now();

        function resize() {
          const dpr = Math.min(window.devicePixelRatio || 1, 2);
          w = window.innerWidth;
          h = window.innerHeight;
          canvas.width = Math.round(w * dpr);
          canvas.height = Math.round(h * dpr);
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }

        function spawn() {
          const tx = Math.random() * w;   // landing spot
          const ty = Math.random() * h;
          const fall = rand(FALL_DIST);
          drops.push({
            x: tx - fall * TAN,
            y: ty - fall,
            tx, ty,
            vy: rand(FALL_SPEED),
            len: rand(STREAK_LEN),
          });
        }

        function frame(now) {
          const dt = Math.min((now - last) / 1000, 0.05); // clamp after tab switches
          last = now;

          // spawn
          spawnAcc += dt * DROPS_PER_SEC_PER_MP * (w * h) / 1e6;
          while (spawnAcc >= 1) { spawn(); spawnAcc--; }

          ctx.clearRect(0, 0, w, h);
          ctx.lineCap = "round";

          // drops
          ctx.lineWidth = 1.2;
          for (let i = drops.length - 1; i >= 0; i--) {
            const d = drops[i];
            d.y += d.vy * dt;
            d.x += d.vy * TAN * dt;

            if (d.y >= d.ty) {
              ripples.push({ x: d.tx, y: d.ty, max: rand(RIPPLE_SIZE), t: 0 });
              drops.splice(i, 1);
              continue;
            }

            const hx = d.x, hy = d.y;
            const txl = hx - d.len * SIN, tyl = hy - d.len * COS;
            const g = ctx.createLinearGradient(txl, tyl, hx, hy);
            g.addColorStop(0, `rgba(${COLOR}, 0)`);
            g.addColorStop(1, `rgba(${COLOR}, 0.6)`);
            ctx.strokeStyle = g;
            ctx.beginPath();
            ctx.moveTo(txl, tyl);
            ctx.lineTo(hx, hy);
            ctx.stroke();
          }

          // ripples (flattened ellipses for a looking-down-at-water perspective)
          ctx.lineWidth = 1;
          for (let i = ripples.length - 1; i >= 0; i--) {
            const r = ripples[i];
            r.t += dt / (r.life || RIPPLE_LIFE);
            if (r.t >= 1) { ripples.splice(i, 1); continue; }

            const ease = 1 - Math.pow(1 - r.t, 2);
            const alpha = (1 - r.t) * 0.55;

            // outer ring
            const rad = r.max * ease;
            ctx.strokeStyle = `rgba(${COLOR}, ${alpha})`;
            ctx.beginPath();
            ctx.ellipse(r.x, r.y, rad, rad * 0.4, 0, 0, Math.PI * 2);
            ctx.stroke();

            // trailing inner ring
            if (r.t > 0.2) {
              const rad2 = rad * 0.55;
              ctx.strokeStyle = `rgba(${COLOR}, ${alpha * 0.7})`;
              ctx.beginPath();
              ctx.ellipse(r.x, r.y, rad2, rad2 * 0.4, 0, 0, Math.PI * 2);
              ctx.stroke();
            }

            // third ring for big tap splashes
            if (r.rings === 3 && r.t > 0.35) {
              const rad3 = rad * 0.3;
              ctx.strokeStyle = `rgba(${COLOR}, ${alpha * 0.5})`;
              ctx.beginPath();
              ctx.ellipse(r.x, r.y, rad3, rad3 * 0.4, 0, 0, Math.PI * 2);
              ctx.stroke();
            }
          }

          // splash droplets: x/y is the spot on the water, z is height above it
          ctx.fillStyle = `rgba(${COLOR}, 0.8)`;
          for (let i = particles.length - 1; i >= 0; i--) {
            const p = particles[i];
            p.x += p.vx * dt;
            p.y += p.vy * dt;
            p.vz -= GRAVITY * dt;
            p.z += p.vz * dt;

            if (p.z <= 0) {
              ripples.push({ x: p.x, y: p.y, max: rand([5, 10]), t: 0 });
              particles.splice(i, 1);
              continue;
            }

            ctx.beginPath();
            ctx.arc(p.x, p.y - p.z, p.size, 0, Math.PI * 2);
            ctx.fill();
          }

          requestAnimationFrame(frame);
        }

        function splash(x, y) {
          ripples.push({ x, y, max: SPLASH_RIPPLE, t: 0, life: SPLASH_LIFE, rings: 3 });

          const n = Math.round(rand(SPLASH_DROPLETS));
          for (let i = 0; i < n; i++) {
            const a = Math.random() * Math.PI * 2;
            const s = rand(DROPLET_SPEED);
            particles.push({
              x, y,
              vx: Math.cos(a) * s,
              vy: Math.sin(a) * s * 0.4, // flattened to match the ripple perspective
              z: 0.1,
              vz: rand(DROPLET_LIFT),
              size: rand([1.2, 2.2]),
            });
          }
        }

        // Drag wake: walk from the last ripple toward the pointer,
        // dropping a ripple every DRAG_SPACING px so fast drags don't leave gaps
        // one entry per active finger/mouse, keyed by pointerId,
        // so multi-touch drags each get their own trail
        const active = new Map();

        function wake(lastPt, x, y) {
          let dx = x - lastPt.x, dy = y - lastPt.y;
          let dist = Math.hypot(dx, dy);
          while (dist >= DRAG_SPACING) {
            lastPt.x += (dx / dist) * DRAG_SPACING;
            lastPt.y += (dy / dist) * DRAG_SPACING;
            ripples.push({ x: lastPt.x, y: lastPt.y, max: rand(DRAG_RIPPLE), t: 0, life: DRAG_LIFE });
            dx = x - lastPt.x;
            dy = y - lastPt.y;
            dist = Math.hypot(dx, dy);
          }
        }

        // canvas ignores pointer events, so listen on the window instead
        window.addEventListener("pointerdown", (e) => {
          splash(e.clientX, e.clientY);
          active.set(e.pointerId, { x: e.clientX, y: e.clientY });
        });
        window.addEventListener("pointermove", (e) => {
          const lastPt = active.get(e.pointerId);
          if (lastPt) wake(lastPt, e.clientX, e.clientY);
        });
        const endDrag = (e) => active.delete(e.pointerId);
        window.addEventListener("pointerup", endDrag);
        window.addEventListener("pointercancel", endDrag);
        window.addEventListener("blur", () => active.clear());

        window.addEventListener("resize", resize);
        resize();
        requestAnimationFrame(frame);
      })();
    </script>
</body>

</html>
